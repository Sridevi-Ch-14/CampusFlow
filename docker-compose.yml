version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: campusflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: campusflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusflow_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: campusflow_backend
    restart: always
    environment:
      - ENVIRONMENT=development
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=campusflow_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=campusflow-production-jwt-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    container_name: campusflow_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=campusflow_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis

volumes:
  mysql_data:
